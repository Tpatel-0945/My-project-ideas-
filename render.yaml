# One-click deploy on Render: New → Blueprint → pick this repo.
# Render's free plan blocks Gmail's ports, so this uses Brevo's HTTPS email API.
services:
  - type: web
    name: collegeos
    runtime: node
    plan: free
    rootDir: collegeos/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: CollegeOS
      - key: OTP_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
